<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | ShopEase</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .admin-container {
            max-width: 1150px;
            margin: 35px auto;
            padding: 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .admin-header a {
            color: #2563eb;
            text-decoration: none;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            align-items: start;
        }

        .admin-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.07);
            margin-bottom: 25px;
        }

        .admin-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .admin-form label {
            display: block;
            margin: 13px 0 6px;
            font-weight: 600;
        }

        .admin-form input,
        .admin-form textarea,
        .admin-form select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font: inherit;
        }

        .admin-form textarea {
            min-height: 80px;
            resize: vertical;
        }

        .admin-button {
            border: none;
            padding: 10px 15px;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .admin-form .admin-button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
        }

        .admin-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary-button {
            background: #64748b;
        }

        .delete-button {
            background: #dc2626;
        }

        .admin-list {
            display: grid;
            gap: 15px;
        }

        .admin-item {
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            padding: 15px;
            overflow-wrap: anywhere;
        }

        .admin-item h3 {
            margin: 0 0 8px;
        }

        .admin-item p {
            margin: 7px 0;
        }

        .admin-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 13px;
        }

        .admin-actions select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 7px;
        }

        .admin-message {
            margin: 15px 0;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .admin-section {
            margin-top: 30px;
        }

        .admin-empty {
            color: #64748b;
            padding: 10px 0;
        }

        @media (max-width: 750px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }

            .admin-container {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

    <main class="admin-container">

        <header class="admin-header">
            <div>
                <h1>ShopEase Admin Dashboard</h1>
                <p>Manage products and customer orders.</p>
            </div>

            <a href="index.html">← Back to Store</a>
        </header>

        <div id="adminMessage" class="admin-message"
             role="status" aria-live="polite"></div>

        <div class="admin-grid">

            <!-- Add/Edit Product -->
            <section class="admin-card">
                <h2 id="productFormTitle">Add New Product</h2>

                <form id="productForm" class="admin-form">

                    <label for="productName">Product Name</label>
                    <input id="productName" type="text"
                           maxlength="150" required>

                    <label for="productDescription">Description</label>
                    <textarea id="productDescription"
                              maxlength="2000" required></textarea>

                    <label for="productPrice">Price (₹)</label>
                    <input id="productPrice" type="number"
                           min="0" step="0.01" required>

                    <label for="productCategory">Category</label>
                    <input id="productCategory" type="text"
                           maxlength="100" required>

                    <label for="productStock">Stock</label>
                    <input id="productStock" type="number"
                           min="0" step="1" required>

                    <label for="productImage">Image URL (optional)</label>
                    <input id="productImage" type="url"
                           placeholder="https://example.com/product.jpg">

                    <button class="admin-button" type="submit"
                            id="saveProductButton">
                        Add Product
                    </button>

                    <button class="admin-button secondary-button"
                            type="button" id="cancelEditButton"
                            hidden>
                        Cancel Edit
                    </button>

                </form>
            </section>

            <!-- Products List -->
            <section class="admin-card">
                <h2>Manage Products</h2>
                <div id="productsMessage" class="admin-message"></div>
                <div id="adminProducts" class="admin-list">
                    Loading products...
                </div>
            </section>

        </div>

        <!-- Orders Management -->
        <section class="admin-card admin-section">
            <h2>Customer Orders</h2>

            <div id="ordersMessage" class="admin-message"></div>

            <div id="adminOrders" class="admin-list">
                Loading orders...
            </div>
        </section>

    </main>

    <script src="admin.js"></script>

</body>
</html>
